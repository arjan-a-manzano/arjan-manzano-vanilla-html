<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Boilerplate from Manuel Matuzović (https://www.matuzo.at/blog/2026/html-boilerplate) -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width">

        <title>Unique page title - My Site</title>

        <link rel="stylesheet" href="/styles.css">

        <link rel="icon" href="/favicon.svg" type="image/svg+xml">
        <link rel="apple-touch-icon" href="/apple-touch-icon.png">
        
        <!-- Android PWA -->
        <!-- .webmanifest
        {
            "name": "My Website",
            "icons": [
                { "src": "/icon-192.png", "type": "image/png", "sizes": "192x192" },
                { "src": "/icon-512.png", "type": "image/png", "sizes": "512x512" },
            ]

        -->
        <link rel="manifest" href="/site.webmanifest"> 

        <meta name="description" content="Page description">
        <meta property="og:image" content="https://web.site/sm.jpg">
        <meta property="og:url" content="">
    </head>

    <body>
        <main class="bg-yellow-primary flex justify-center ">
            <!-- NOTE: check if overflow-x-clip causes some issues -->
            <section class="w-full h-dvh bg-melonade-yellow" style="min-height: 667px;">
                <div class="w-full h-full grid" style="grid-template-columns: 8px 1fr 8px; grid-template-rows: 8px 1fr 8px;">
                    <div class="bg-blue-primary-75pc col-start-1 row-start-1" aria-hidden="true"></div>
                    <div class="grid-border-vertical-8px bg-blue-primary-75pc col-start-2 row-start-1" aria-hidden="true"></div>
                    <div class="grid-border-side-8px bg-blue-primary-75pc col-start-1 row-start-2" aria-hidden="true"></div>
                    <div class="bg-blue-primary-75pc col-start-3 row-start-1" aria-hidden="true"></div>

                    <div class="h-full w-full grid inner-grid-mobile" style="
                        grid-column-start: 2;
                        grid-row-start: 2; 
                        border: 1px solid var(--arjan-white-primary-75pc);
                    ">
                        <!-- NOTE: inspo from https://stackoverflow.com/questions/76903943/css-grid-layout-square-cells -->
                        <!-- NOTE: in calc nest, horizontal padding and outer horizontal grid border width is accounted for -->
                        <h1 class="text-orange-primary col-span-full text-center w-full h-full"
                        style="
                            grid-row: 2 / span 4;
                        "
                        >
                            Arjan<br>
                            Manzano
                        </h1>
                        <p class="w-full h-full font-bold text-blue-primary" style="
                            grid-row: 7;
                            grid-column: 2 / span 5;
                        "
                        >In pursuit of technological empowerment</p>
                        <p class="w-full h-full text-right text-blue-primary" style="
                            grid-row: 7;
                            grid-column: 7 / span 5;
                        "
                        >Quezon City, Philippines</p>
                    </div>

                    <div class="bg-blue-primary-75pc col-start-1 row-start-3" aria-hidden="true"></div>
                    <div class="grid-border-side-8px bg-blue-primary-75pc col-start-3 row-start-2" aria-hidden="true"></div>
                    <div class="grid-border-vertical-8px bg-blue-primary-75pc col-start-2 row-start-3" aria-hidden="true"></div>
                    <div class="bg-blue-primary-75pc col-start-3 row-start-3" aria-hidden="true"></div>
                </div>
            </section>
        </main>
