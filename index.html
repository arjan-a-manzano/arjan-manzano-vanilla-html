<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Boilerplate from Manuel Matuzović (https://www.matuzo.at/blog/2026/html-boilerplate) -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width">

        <title>Unique page title - My Site</title>

        <link rel="stylesheet" href="/styles.css">

        <link rel="icon" href="/favicon.svg" type="image/svg+xml">
        <link rel="apple-touch-icon" href="/apple-touch-icon.png">
        
        <!-- Android PWA -->
        <!-- .webmanifest
        {
            "name": "My Website",
            "icons": [
                { "src": "/icon-192.png", "type": "image/png", "sizes": "192x192" },
                { "src": "/icon-512.png", "type": "image/png", "sizes": "512x512" },
            ]

        -->
        <link rel="manifest" href="/site.webmanifest"> 

        <meta name="description" content="Page description">
        <meta property="og:image" content="https://web.site/sm.jpg">
        <meta property="og:url" content="">
    </head>

    <body>
        <main class="bg-prussian-blue-primary flex justify-center ">
            <!-- NOTE: check if overflow-x-clip causes some issues -->
            <section class="w-full h-dvh" style="min-height: 667px;">
                <div class="w-full h-full grid" style="grid-template-columns: 8px 1fr 8px; grid-template-rows: 8px 1fr 8px;">
                    <div class="grid-border-vertical-8px" style="grid-column-start: 2; grid-row-start: 1;" aria-hidden="true"></div>
                    <div class="grid-border-side-8px" style="grid-column-start: 1; grid-row-start: 2;" aria-hidden="true"></div>

                    <div class="h-full w-full grid" style="
                        grid-column-start: 2;
                        grid-row-start: 2; 
                        border: 1px solid var(--arjan-warm-ivory-white-primary-50pc);
                        padding: 8px;
                    ">
                        <!-- outline: 1px var(--arjan-warm-ivory-white-primary) solid; -->
                        <div class="w-full h-full grid" style="
                            grid-template-columns: repeat(12, calc(calc((100vw - 32px) - 12 * 4px) / 12));
                            grid-template-rows: repeat(auto-fill, calc(calc((100vw - 32px) - 12 * 4px) / 12));
                            gap: 4px;
                        ">
                        <!-- NOTE: inspo from https://stackoverflow.com/questions/76903943/css-grid-layout-square-cells -->
                        <!-- NOTE: in calc nest, horizontal padding and outer horizontal grid border width is accounted for -->
                            <h1 class="text-sinopia-orange col-span-full text-center w-full">
                                Arjan<br>
                                Manzano
                            </h1>
                        </div>
                    </div>

                    <div class="grid-border-side-8px" style="grid-column-start: 3; grid-row-start: 2;" aria-hidden="true"></div>
                    <div class="grid-border-vertical-8px" style="grid-column-start: 2; grid-row-start: 3;" aria-hidden="true"></div>
                </div>
            </section>
        </main>
